<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .subscribe-button{
            background-color: rgb(141, 6, 6);
            color: white;
            border: none;
            height: 36px;
            width: 105;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }
       .join-button{
        background-color:white;
        border-color: rgb(98, 98, 228);
        border-style: solid;
        border-width: 1px;
        color:rgb(98, 98, 228) ;
        height: 36px;
        width: 62px;
        border-radius: 2px;
        cursor: pointer;

       } 
       .Tweet-button{
        background-color:rgb(76, 140, 213);
        color: white;
        border:none ;
        height: 36px;
        width: 74px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-left: 8px;

       }
    </style>
    <button class="subscribe-button">
        SUBSCRIBE</button>
    <button class="join-button">
         JOIN </button>
    <button class="Tweet-button">
        Tweet
    </button>
</body>
</html>
